name: Rassegna Telpress (10-13, ogni 30 min)

on:
  schedule:
    # Range UTC 8-12 copre 10-14 CEST e 9-13 CET.
    # Minuti 7/37 = anti-peak (evita :00/:15/:30/:45, i picchi di carico GitHub).
    # Il guard interno applica la logica fine basata sull'ora italiana reale.
    - cron: "*/5 6-13 * * *""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telpress-rassegna
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PORTAL_URL: https://ancepiemonte.streamlit.app/
      LOGO_PATH: logo-ance.png
      NOTIFY_BCC_FILE: notify_bcc.txt
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ⏰ Guard finestra 10:00-13:00 (Europe/Rome), ogni 30 minuti
      #   Slot attesi: 10:00, 10:30, 11:00, 11:30, 12:00, 12:30, 13:00
      #   Il cron emette a :07 e :37 → quartet 0 e quartet 2
      - name: Time window guard (10:00-13:00, every 30')
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Rome"))
          hour = now.hour
          quartet = now.minute // 15   # 0=:00-:14, 1=:15-:29, 2=:30-:44, 3=:45-:59

          slot_full = quartet == 0     # slot "tondo" XX:00
          slot_half = quartet == 2     # slot "mezz'ora" XX:30

          if 10 <= hour <= 12 and (slot_full or slot_half):
              should_run = True
              label = f"RUN slot {hour:02d}:{'00' if slot_full else '30'}"
          elif hour == 13 and slot_full:
              should_run = True
              label = "RUN slot 13:00 (closing)"
          else:
              should_run = False
              label = "OUTSIDE window"

          print(f"Ora locale: {now.strftime('%Y-%m-%d %H:%M %Z')}")
          print(f"Classificazione: {label}")
          print(f"Should run: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
              f.write(f"label={label}\n")
          PY

      # 🕗 Esecuzione automatica (schedulata)
      - name: Run Telpress Bot (scheduled)
        if: ${{ github.event_name == 'schedule' && steps.guard.outputs.should_run == 'true' }}
        env:
          SENDER_FILTER:        ${{ secrets.SENDER_FILTER }}
          SUBJECT_PREFIX:       ${{ secrets.SUBJECT_PREFIX }}
          DRIVE_FOLDER_ID:      ${{ secrets.DRIVE_FOLDER_ID }}
          TIMEZONE:             Europe/Rome
          SERVICE_ACCOUNT_FILE: service_account.json
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_DELEGATED_USER: "direzione@ancepiemonte.it"
          SMTP_HOST:           "smtp.gmail.com"
          SMTP_PORT:           "465"
          SMTP_SECURE:         "ssl"
          SMTP_STRICT:         "1"
          SMTP_USER:           "info@ancepiemonte.it"
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          SMTP_SENDER_NAME:    "ANCE Piemonte Valle d'Aosta"
          DEBUG: "0"
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json
          python telpress_email_to_drive.py --quiet

      # 🚀 Esecuzione manuale (force, log estesi)
      - name: Run Telpress Bot (manual, force)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SENDER_FILTER:        ${{ secrets.SENDER_FILTER }}
          SUBJECT_PREFIX:       ${{ secrets.SUBJECT_PREFIX }}
          DRIVE_FOLDER_ID:      ${{ secrets.DRIVE_FOLDER_ID }}
          TIMEZONE:             Europe/Rome
          SERVICE_ACCOUNT_FILE: service_account.json
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_DELEGATED_USER: "direzione@ancepiemonte.it"
          SMTP_HOST:           "smtp.gmail.com"
          SMTP_PORT:           "465"
          SMTP_SECURE:         "ssl"
          SMTP_STRICT:         "1"
          SMTP_USER:           "info@ancepiemonte.it"
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          SMTP_SENDER_NAME:    "ANCE Piemonte Valle d'Aosta"
          DEBUG: "1"
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json
          python telpress_email_to_drive.py --force-now
