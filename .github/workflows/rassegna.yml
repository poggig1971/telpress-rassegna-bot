name: Rassegna Telpress (HOT 09-11 / TAIL 11-13:30)

on:
  schedule:
    # Range UTC 07-12 copre 09-14 italiana in CEST e 08-13 italiana in CET.
    # Il guard interno applica la logica fine basata sull'ora italiana reale.
    - cron: "*/15 7-12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telpress-rassegna
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PORTAL_URL: https://ancepiemonte.streamlit.app/
      LOGO_PATH: logo-ance.png
      NOTIFY_BCC_FILE: notify_bcc.txt
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ⏰ Guard a densità variabile (Europe/Rome)
      #   HOT  09:00-10:59 → esegui sempre (ogni 15')
      #   TAIL 11:00-13:29 → esegui solo nei quartetti :00-:14 e :30-:44 (ogni 30')
      - name: Time window guard (HOT/TAIL)
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Rome"))
          hhmm = now.hour * 100 + now.minute
          quartet = now.minute // 15   # 0=:00-:14, 1=:15-:29, 2=:30-:44, 3=:45-:59

          in_hot  = 900  <= hhmm < 1100
          in_tail = 1100 <= hhmm < 1330 and quartet in (0, 2)
          should_run = in_hot or in_tail

          if in_hot:
              label = "HOT (every 15')"
          elif 1100 <= hhmm < 1330:
              label = "TAIL slot" if in_tail else "TAIL skip (off-slot)"
          else:
              label = "OUTSIDE window"

          print(f"Ora locale: {now.strftime('%Y-%m-%d %H:%M %Z')}")
          print(f"Classificazione: {label}")
          print(f"Should run: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
              f.write(f"label={label}\n")
          PY

      # 🕗 Esecuzione automatica (schedulata)
      - name: Run Telpress Bot (scheduled)
        if: ${{ github.event_name == 'schedule' && steps.guard.outputs.should_run == 'true' }}
        env:
          SENDER_FILTER:        ${{ secrets.SENDER_FILTER }}
          SUBJECT_PREFIX:       ${{ secrets.SUBJECT_PREFIX }}
          DRIVE_FOLDER_ID:      ${{ secrets.DRIVE_FOLDER_ID }}
          TIMEZONE:             Europe/Rome
          SERVICE_ACCOUNT_FILE: service_account.json
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_DELEGATED_USER: "direzione@ancepiemonte.it"
          SMTP_HOST:           "smtp.gmail.com"
          SMTP_PORT:           "465"
          SMTP_SECURE:         "ssl"
          SMTP_STRICT:         "1"
          SMTP_USER:           "info@ancepiemonte.it"
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          SMTP_SENDER_NAME:    "ANCE Piemonte Valle d'Aosta"
          DEBUG: "0"
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json
          python telpress_email_to_drive.py --quiet

      # 🚀 Esecuzione manuale (force, log estesi)
      - name: Run Telpress Bot (manual, force)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SENDER_FILTER:        ${{ secrets.SENDER_FILTER }}
          SUBJECT_PREFIX:       ${{ secrets.SUBJECT_PREFIX }}
          DRIVE_FOLDER_ID:      ${{ secrets.DRIVE_FOLDER_ID }}
          TIMEZONE:             Europe/Rome
          SERVICE_ACCOUNT_FILE: service_account.json
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_DELEGATED_USER: "direzione@ancepiemonte.it"
          SMTP_HOST:           "smtp.gmail.com"
          SMTP_PORT:           "465"
          SMTP_SECURE:         "ssl"
          SMTP_STRICT:         "1"
          SMTP_USER:           "info@ancepiemonte.it"
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          SMTP_SENDER_NAME:    "ANCE Piemonte Valle d'Aosta"
          DEBUG: "1"
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json
          python telpress_email_to_drive.py --force-now
