name: Rassegna Telpress (08–14:59 ogni 20')

on:
  schedule:
    # Cron in UTC. 6-13 UTC copre 08-14:59 ora italiana sia in CET (UTC+1) sia in CEST (UTC+2).
    # Minuti 7,27,47 invece di */20 per evitare i picchi di carico GitHub a :00,:20,:40.
    - cron: "7,27,47 6-13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telpress-rassegna
  cancel-in-progress: false   # FIX: evita di tagliare run a metà

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PORTAL_URL: https://ancepiemonte.streamlit.app/
      LOGO_PATH: logo-ance.png
      NOTIFY_BCC_FILE: notify_bcc.txt
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ⏰ Guardia oraria 08:00–14:59 (Europe/Rome) — VERA, con output GitHub
      - name: Time window guard (Europe/Rome 08:00–14:59)
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Rome"))
          hhmm = now.hour * 100 + now.minute
          in_window = 800 <= hhmm < 1500   # 08:00–14:59 incluso
          print(f"Ora locale: {now.strftime('%Y-%m-%d %H:%M %Z')} → in_window={in_window}")
          # Scrive output GitHub leggibile dagli step successivi
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"in_window={'true' if in_window else 'false'}\n")
          PY

      # 🕗 Esecuzione automatica (schedulata) — SOLO se il guard ha detto sì
      - name: Run Telpress Bot (scheduled)
        if: ${{ github.event_name == 'schedule' && steps.guard.outputs.in_window == 'true' }}
        env:
          SENDER_FILTER:        ${{ secrets.SENDER_FILTER }}
          SUBJECT_PREFIX:       ${{ secrets.SUBJECT_PREFIX }}
          DRIVE_FOLDER_ID:      ${{ secrets.DRIVE_FOLDER_ID }}
          TIMEZONE:             Europe/Rome
          SERVICE_ACCOUNT_FILE: service_account.json
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_DELEGATED_USER: "direzione@ancepiemonte.it"
          SMTP_HOST:           "smtp.gmail.com"
          SMTP_PORT:           "465"
          SMTP_SECURE:         "ssl"
          SMTP_STRICT:         "1"
          SMTP_USER:           "info@ancepiemonte.it"
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          SMTP_SENDER_NAME:    "ANCE Piemonte Valle d'Aosta"
          DEBUG: "0"
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json
          python telpress_email_to_drive.py --quiet

      # 🚀 Esecuzione manuale (force, log estesi)
      - name: Run Telpress Bot (manual, force)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SENDER_FILTER:        ${{ secrets.SENDER_FILTER }}
          SUBJECT_PREFIX:       ${{ secrets.SUBJECT_PREFIX }}
          DRIVE_FOLDER_ID:      ${{ secrets.DRIVE_FOLDER_ID }}
          TIMEZONE:             Europe/Rome
          SERVICE_ACCOUNT_FILE: service_account.json
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_DELEGATED_USER: "direzione@ancepiemonte.it"
          SMTP_HOST:           "smtp.gmail.com"
          SMTP_PORT:           "465"
          SMTP_SECURE:         "ssl"
          SMTP_STRICT:         "1"
          SMTP_USER:           "info@ancepiemonte.it"
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          SMTP_SENDER_NAME:    "ANCE Piemonte Valle d'Aosta"
          DEBUG: "1"
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json
          python telpress_email_to_drive.py --force-now
